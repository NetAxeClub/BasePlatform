# uwsgi 配置文件
[uwsgi]
; 启用 master 进程，管理 worker，提供大量高级功能
master = true
; log 在 master 中处理
log-master = true
; 使用单独的线程处理插件化 logger
threaded-logger = true
; 日志格式优化，包含更多有用信息
logformat = %(asctime)s [%(levelname)s] [%(proto)s %(status)s] %(method)s %(uri)s => generated %(size)s bytes in %(msecs)s msecs (vpid: %(pid)s)

# 端口
socket = :8000
# django项目绝对路径
chdir = /app
# 模块路径（项目名称.wsgi）
module = netaxe.wsgi:application

# 进程与线程优化
# 建议根据 CPU 核心数调整，公式通常为 2 * cores + 1
# 之前的 80 进程 + 80 线程会导致极高的上下文切换开销和内存占用
processes = 16
threads = 32
# 必须启用，否则 python 线程无法正常工作
enable-threads = true

# 稳定性与内存管理
# 退出时候回收pid文件
vacuum = true
# 运行一定次数后重启 worker，防止内存泄漏
max-requests = 5000
# 运行一定时间后重启 worker
max-worker-lifetime = 3600
# 当进程内存超过此值时重启 (512MB)
reload-on-rss = 512
# 确保在 fork 之后加载应用，避免共享数据库连接等资源问题
lazy-apps = true

# 超时控制
# 设置超时时间，防止请求卡死，建议与 Nginx 的 timeout 保持一致 (300s)
harakiri = 300
harakiri-verbose = true
# 增加 buffer size 解决部分 header 过大的问题 (如 Cookie 过多)
buffer-size = 65535

# 日志配置
# 使用 logto 确保 log-maxsize 轮转配置生效
logto = /app/logs/uwsgi.log
# 日志大小配置50M (50000000 bytes)
log-maxsize = 50000000
# 打印内存报告
memory-report = true

# 状态监控 (可通过 uwsgi-top 等工具连接)
stats = :9191