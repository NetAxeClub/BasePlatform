upstream backend {
    server base-backend:8000;
    keepalive 32;
}

upstream websocket {
    server base-backend:8001;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # 基础安全配置
    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    # Gzip 压缩优化
    gzip on;
    gzip_proxied any;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 真实 IP 获取配置 (全局)
    ; set_real_ip_from 10.254.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root html;
    }

    location / {
        include uwsgi_params;
        uwsgi_pass backend;

        # 与 uwsgi.ini 中的 harakiri = 300 匹配
        uwsgi_connect_timeout 300s;
        uwsgi_read_timeout 300s;
        uwsgi_send_timeout 300s;

        # 传递必要的 Header
        uwsgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
        uwsgi_param HTTP_X_FORWARDED_PROTO $scheme;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        # 静态资源缓存优化
        expires 7d;
        autoindex off;
        add_header Cache-Control "public, no-transform";
        root /app;
        add_header Vary Accept-Encoding;
        access_log off;
    }

    location /base_platform/ws/ {
        proxy_pass http://websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_redirect off;

        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
    }

    # 缓冲区优化，匹配 uwsgi.ini 的 buffer-size
    large_client_header_buffers 4 16k;
    client_max_body_size 50m;
    client_body_buffer_size 128k;
    keepalive_timeout 65;
    keepalive_requests 1000;
}